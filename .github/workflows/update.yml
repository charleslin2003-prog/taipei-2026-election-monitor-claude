name: Update data and deploy

on:
  schedule:
    # Backup only. Each update dispatches heartbeat.yml, which starts the next
    # update about 20 minutes later; GitHub drops many schedule runs, so this
    # cron just restarts that chain if it ever breaks. A missed stretch is
    # caught up automatically (see catch_up_window).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補 2026/1/1 以來的新聞（約 5–10 分鐘）"
        type: boolean
        default: false
      history:
        description: "回溯 2026 年以前最早的選舉新聞（約 15–30 分鐘）"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests and reviewed-data checks
        run: python -m pytest -q
      - name: Page script syntax
        run: node --check web/app.js

  update:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.run ${{ inputs.backfill && '--backfill' || '' }} ${{ inputs.history && '--history' || '' }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Schedule next update
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run heartbeat.yml --repo "${{ github.repository }}" --ref main

  deploy:
    needs: [test, update]
    if: always() && needs.test.result == 'success' && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site
        run: |
          mkdir _site
          cp -r web/* _site/
          cp -r data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
